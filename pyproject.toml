[project]
name = "d405-3dscanner-server"
version = "0.1.0"
description = "Draft demo server for D405 3D scanner captures"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
research = [
    "open3d>=0.19",
    "numpy>=2.0",
    "dash>=4.0",
    "plotly>=6.0",
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "requests>=2.30",
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]

[tool.uv]
package = false
