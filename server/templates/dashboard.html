<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D405 3D Scanner — Dashboard</title>
  <style>
    :root { --bg:#0f1419; --card:#1a212b; --line:#2a3441; --txt:#e6edf3; --muted:#8b98a5; --accent:#4493f8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
    header { padding:24px 32px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:20px; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .stats { display:flex; gap:16px; flex-wrap:wrap; padding:24px 32px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 20px; min-width:110px; }
    .stat .n { font-size:26px; font-weight:600; }
    .stat .l { color:var(--muted); font-size:12px; margin-top:2px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; padding:8px 32px 40px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .thumb { width:100%; height:180px; object-fit:cover; background:#0b0e13; display:block; }
    .no-thumb { width:100%; height:180px; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#0b0e13; font-size:13px; }
    .body { padding:14px 16px; }
    .sid { font-family: ui-monospace, monospace; font-size:13px; }
    .when { color:var(--muted); font-size:12px; margin:4px 0 10px; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
    .b-local_only { background:#3a2f15; color:#e3b341; }
    .b-synced { background:#15351f; color:#3fb950; }
    .b-failed { background:#3a1c1c; color:#f85149; }
    .b-uploading { background:#15293a; color:#4493f8; }
    .files { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .files a { font-size:12px; color:var(--accent); text-decoration:none; border:1px solid var(--line); padding:3px 8px; border-radius:6px; }
    .files a:hover { border-color:var(--accent); }
    .dims { color:var(--muted); font-size:12px; margin-top:8px; }
  </style>
</head>
<body>
  <header>
    <h1>D405 3D Scanner — Capture Dashboard</h1>
    <div class="sub">Draft demo · local Postgres · <span id="conn"></span></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>

  <script>
    const fmtDims = c =>
      (c.obj_width_mm || c.obj_height_mm || c.obj_depth_mm)
        ? `${c.obj_width_mm ?? '–'} × ${c.obj_height_mm ?? '–'} × ${c.obj_depth_mm ?? '–'} mm`
        : '尺寸未量度';

    const fileLink = (name, label) =>
      name ? `<a href="/files/${name}" target="_blank">${label}</a>` : '';

    async function load() {
      try {
        const [stats, caps] = await Promise.all([
          fetch('/api/stats').then(r => r.json()),
          fetch('/api/captures').then(r => r.json()),
        ]);
        document.getElementById('conn').textContent = `已連線 · ${caps.length} captures`;

        const S = [
          ['Total', stats.total], ['Synced', stats.synced],
          ['Local only', stats.local_only], ['Failed', stats.failed],
          ['Point clouds', stats.with_pointcloud], ['Cleaned', stats.with_clean],
        ];
        document.getElementById('stats').innerHTML = S.map(
          ([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`
        ).join('');

        document.getElementById('grid').innerHTML = caps.map(c => `
          <div class="card">
            ${c.color_path
              ? `<img class="thumb" src="/files/${c.color_path}" loading="lazy" />`
              : `<div class="no-thumb">無 color 圖</div>`}
            <div class="body">
              <div class="sid">${c.session_id ?? '#' + c.id}</div>
              <div class="when">${c.captured_at ? new Date(c.captured_at).toLocaleString() : ''}</div>
              <span class="badge b-${c.sync_status}">${c.sync_status}</span>
              <div class="dims">${fmtDims(c)}</div>
              <div class="files">
                ${fileLink(c.depth_vis_path, 'depth')}
                ${fileLink(c.ply_path, 'ply')}
                ${fileLink(c.clean_ply_path, 'ply·clean')}
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('conn').textContent = '連線失敗 — 檢查 server / DB';
        console.error(e);
      }
    }
    load();
  </script>
</body>
</html>
